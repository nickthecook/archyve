forwards:
  deps: deps            # `ops deps <action>` runs in deps/ops.yml

dependencies:
  # `ops up` runs `docker compose up -d` in deps/; `ops down` runs `docker compose down`.
  docker:
    - deps
  # Keep gems in sync when meeting dependencies.
  custom:
    - bundle check || bundle install

actions:
  server:
    command: bin/dev
    load_secrets: true
  rails:
    command: bin/rails
    load_secrets: true
  rake: bin/rake
  api:
    # ops api /api/tools
    # ops api /api/tools/list_collections ""
    # ops api /api/tools/search_archive '{"queries": ["refrigerator model number"]}'
    command: bin/api.sh
    load_secrets: true
  search:
    command: "ops api /api/tools/search_archive '{\"queries\": [\"'\"$1\"'\"]}'"
    param_expansion: true
  test:
    command: RAILS_ENV=test bundle exec rspec
    alias: t
  lint:
    command: bundle exec rubocop
    alias: l
  lint-fix:
    command: bundle exec rubocop -a
    alias: lf
  clean-demo-data:
    command: "ops rails runner 'Sources::Folder.where(name: [\"Engineering handbook\", \"Runbooks\"]).destroy_all; Endpoint.destroy_all'"
    not_in_envs: [production]

options:
  exec:
    load_secrets: true
  environment:
    # Map ops `dev` -> Rails `development`; other envs pass through unchanged.
    RAILS_ENV: "`test \"$environment\" == dev && echo -n development || echo -n \"$environment\"`"
