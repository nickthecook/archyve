default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # Docling conversions get their own pool, sized independently: it's the
    # one job here that can pin a CPU core and hold significant memory for
    # minutes, so its concurrency is capped separately from everything else
    # to avoid starving the VM (or getting the container killed).
    - queues: docling
      threads: <%= ENV.fetch("DOCLING_JOB_CONCURRENCY", 2) %>
      processes: 1
      polling_interval: 1

    # Everything else, one pool for both queues. This work is overwhelmingly
    # spent waiting — on Ollama, or on whatever a source is reading from — so
    # threads are cheap here and starvation is the real risk: a single long
    # scan holding one used to leave few for everything else.
    - queues: [ default, ingestion ]
      threads: <%= ENV.fetch("JOB_THREADS", 8) %>
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
