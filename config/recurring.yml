# Recurring tasks, run by the Solid Queue scheduler. The scheduler only exists
# inside a running supervisor — in development that is the one Puma forks via
# the plugin in config/puma.rb (SOLID_QUEUE_IN_PUMA=1, set in Procfile.dev).

default: &default
  # A fixed heartbeat, not a per-source schedule: the job asks
  # Source.due_for_sync which sources have passed their own interval, so
  # intervals are configured per source in the UI and never here.
  enqueue_due_source_syncs:
    class: Sources::EnqueueDueSyncsJob
    queue: ingestion
    schedule: every minute

  # Ticks more often than InferenceServer::CHECK_INTERVAL on purpose: the tick
  # only enqueues what the scope says is stale, so a short heartbeat means a
  # server that has just gone quiet is probed within minutes of falling out of
  # date rather than up to an hour late.
  enqueue_due_inference_checks:
    class: InferenceServers::EnqueueDueChecksJob
    queue: default
    schedule: every 5 minutes

development:
  <<: *default

  # Development turns autotrim off (config/cable.yml), so nothing prunes
  # solid_cable_messages on broadcast any more — this does it out of band.
  # With autotrim off the job skips its per-write dice roll and trims on every
  # run, deleting up to trim_batch_size rows in one transaction.
  trim_solid_cable_messages:
    class: SolidCable::TrimJob
    queue: default
    schedule: every minute

production:
  <<: *default

  # Autotrim is off here too (config/cable.yml), so this is the only thing
  # pruning solid_cable_messages.
  trim_solid_cable_messages:
    class: SolidCable::TrimJob
    queue: default
    schedule: every minute

  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
