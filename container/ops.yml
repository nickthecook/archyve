# Every action loads secrets: compose refuses to read compose.yml at all, even
# for `down`, while a required variable is unset.
actions:
  start:
    command: docker compose up -d
    load_secrets: true
  stop:
    command: docker compose down
    load_secrets: true
  restart:
    command: docker compose restart
    load_secrets: true
    alias: r
  bounce: ops stop && ops start
  restart-with-logs:
    command: ops restart && ops logs
    alias: rl
  bounce-with-logs:
    command: ops bounce && ops logs
    alias: bl
  build:
    command: docker compose build
    alias: b
    load_secrets: true
  ps:
    command: docker compose ps
    load_secrets: true
  logs:
    command: docker compose logs --tail 100 -f
    alias: l
    load_secrets: true
  console:
    command: docker compose exec web bin/rails console
    alias: c
    load_secrets: true
